services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    environment:
      BACKEND_API_URL: http://host.docker.internal:3000/api/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "4000:4000"

volumes:
  web_node_modules:
