name: Deploy admin web (production)

# Builds the admin web app once from the commit that just passed CI -- in this
# same run -- and delivers that exact artifact to the EC2 instance through AWS
# Systems Manager Run Command. No SSH is opened to GitHub and no AWS secret is
# stored in GitHub: the job assumes an IAM role through OIDC for its few
# minutes. The instance re-verifies the artifact's SHA-256 (passed out of band)
# before unpacking it. See docs/deployment/static-spa.md ("Continuous
# delivery") for the one-time AWS and GitHub settings.
#
# It does nothing until the repository variables below are set, and the
# `production` environment should require a reviewer.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production-web
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build the artifact for this commit
    needs: ci
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' && vars.EC2_INSTANCE_ID != '' && vars.PUBLIC_ORIGIN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build for the public origin
        working-directory: web
        env:
          VITE_API_BASE_URL: ${{ vars.PUBLIC_ORIGIN }}/api/v1
        run: npm run build

      - name: Verify the static build
        working-directory: web
        env:
          API_BASE: ${{ vars.PUBLIC_ORIGIN }}/api/v1
        run: node scripts/verify-static-build.mjs --api-base "$API_BASE" build/client

      - name: Package
        id: package
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tar -czf "${COMMIT_SHA}.tar.gz" -C web/build/client .
          echo "sha256=$(sha256sum "${COMMIT_SHA}.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-${{ github.sha }}
          path: ${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy this commit
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-${{ github.sha }}

      - name: Assume the deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: descon-fe-deploy-${{ github.run_id }}

      - name: Upload the artifact and deploy it on the instance
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          COMMIT_SHA: ${{ github.sha }}
          ARTIFACT_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          key="web/${COMMIT_SHA}.tar.gz"
          aws s3 cp --only-show-errors "${COMMIT_SHA}.tar.gz" "s3://${ARTIFACT_BUCKET}/${key}"

          # The checksum travels through SSM, not through the bucket, so a
          # swapped object is detected on the instance.
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name DesconDeployWeb \
            --parameters "commitSha=${COMMIT_SHA},artifactKey=${key},artifactSha256=${ARTIFACT_SHA256}" \
            --comment "descon-fe ${COMMIT_SHA}" \
            --query Command.CommandId --output text)"
          echo "SSM command: ${command_id}"

          status=Pending
          for _ in $(seq 1 120); do
            sleep 10
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2> /dev/null || echo Pending)"
            case "$status" in
              Success | Failed | Cancelled | TimedOut) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '{stdout: StandardOutputContent, stderr: StandardErrorContent}' --output text || true
          echo "Final status: ${status}"
          [[ "$status" == "Success" ]]
